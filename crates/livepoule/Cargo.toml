[package]
name = "livepoule"
description = "ManageComp Live : boîtier de score et d'affichage de piste (Raspberry Pi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# GPIO matériel via `rppal` et lecture de la configuration Wi-Fi sur clé USB
# (équivalent du `-DWIRING_PI` du C++). N'a d'effet que sur la cible Linux ARM :
# ailleurs, le GPIO simulé au clavier reste utilisé.
raspberry = ["dep:rppal"]

[lib]
name = "livepoule"
path = "src/lib.rs"

[[bin]]
name = "managecomp-live"
path = "src/main.rs"

[dependencies]
bp-net = { workspace = true }
gtk4 = { workspace = true }
glib = { workspace = true }
log = { workspace = true }
rand = { workspace = true }
tiny_http = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }
qrcode = { workspace = true }
if-addrs = { workspace = true }
socket2 = { workspace = true }
ureq = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(all(target_os = "linux", any(target_arch = "arm", target_arch = "aarch64")))'.dependencies]
rppal = { workspace = true, optional = true }

[build-dependencies]
winresource = "0.1"
