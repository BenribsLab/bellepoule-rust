[package]
name = "marshaller"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "managecomp-organisation"
path = "src/main.rs"
required-features = ["gui"]

[features]
# Interface GTK (fenêtre du Marshaller, vue intégrée à BellePoule). Sans elle,
# la bibliothèque ne contient que la logique (utilisée par l'API web).
default = ["gui"]
gui = ["dep:bp-gtk", "dep:gtk4", "dep:cairo-rs", "dep:pango", "dep:pangocairo", "dep:glib", "dep:gio", "dep:gdk-pixbuf"]

[dependencies]
bp-core = { workspace = true }
bp-net = { workspace = true }
bp-gtk = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
cairo-rs = { workspace = true, optional = true }
pango = { workspace = true, optional = true }
pangocairo = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
log = { workspace = true }
gio = { workspace = true, optional = true }
gdk-pixbuf = { workspace = true, optional = true }
chrono = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
qrcode = { workspace = true }
encoding_rs = { workspace = true }
ureq = { workspace = true }

[build-dependencies]
winresource = "0.1"
